<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Teste Rede MMN 3x10</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .node { margin: 5px 0; padding: 5px; border-left: 2px solid #ccc; }
        .active { background: #e0ffe0; }
        .children { margin-left: 20px; }
        .error { color: red; background: #ffeeee; padding: 10px; }
    </style>
</head>
<body>
    <h1>Teste de Rede 3x10 (consulta direta)</h1>
    <input type="number" id="participanteId" value="1" placeholder="ID do participante">
    <button onclick="carregarRede()">Carregar Rede</button>
    <div id="resultado"></div>

    <script>
        const SUPABASE_URL = 'https://wlkmzazcxymjhksuvgzo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_BpaEG3Ayb2_POqT1cSfV5A_GBIJLtal';

        async function carregarRede() {
            const id = document.getElementById('participanteId').value;
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = 'Carregando...';
            
            try {
                // Buscar TODOS os participantes (para montar a árvore em memória)
                const response = await fetch(`${SUPABASE_URL}/rest/v1/participantes?select=id,nome,plano,status,posicao,id_pai`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                const data = await response.json();
                console.log('Total de participantes:', data.length);
                
                if (!Array.isArray(data)) {
                    resultadoDiv.innerHTML = `<div class="error">Erro: ${JSON.stringify(data)}</div>`;
                    return;
                }
                
                // Encontrar o participante raiz
                const root = data.find(p => p.id == id);
                if (!root) {
                    resultadoDiv.innerHTML = `<div class="error">Participante ID ${id} não encontrado.</div>`;
                    return;
                }
                
                // Montar árvore recursivamente
                function getChildren(parentId, nivel = 0) {
                    const children = data.filter(p => p.id_pai === parentId && p.status === 'Ativo');
                    return children.map(child => ({
                        ...child,
                        nivel: nivel + 1,
                        children: getChildren(child.id, nivel + 1)
                    }));
                }
                
                const tree = {
                    ...root,
                    nivel: 0,
                    children: getChildren(root.id)
                };
                
                function renderNode(node) {
                    const indent = node.nivel * 20;
                    let html = `<div class="node active" style="margin-left: ${indent}px">`;
                    html += `<strong>${node.nome}</strong> (ID:${node.id}) - ${node.plano} - ${node.status}`;
                    if (node.posicao > 0) html += ` - Pos: ${node.posicao}`;
                    html += `</div>`;
                    
                    if (node.children && node.children.length > 0) {
                        html += `<div class="children">`;
                        node.children.forEach(child => {
                            html += renderNode(child);
                        });
                        html += `</div>`;
                    }
                    
                    return html;
                }
                
                resultadoDiv.innerHTML = renderNode(tree);
                
            } catch (error) {
                resultadoDiv.innerHTML = `<div class="error">Erro: ${error.message}</div>`;
            }
        }
        
        window.onload = () => carregarRede();
    </script>
</body>
</html>
