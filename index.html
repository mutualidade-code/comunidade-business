<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade Business - Rede</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f2f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .node { margin: 5px 0; padding: 8px; border-left: 3px solid #366092; background: #f9f9f9; }
        .active { background: #e8f5e9; border-left-color: #4caf50; }
        .children { margin-left: 30px; }
        .error { color: red; background: #ffebee; padding: 10px; border-radius: 5px; }
        .plano-badge { background: #366092; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        .status-Ativo { background: #4caf50; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌳 Comunidade Business - Minha Rede</h1>
        <div id="resultado">Carregando...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wlkmzazcxymjhksuvgzo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_BpaEG3Ayb2_POqT1cSfV5A_GBIJLtal';
        const USUARIO_ID = 1;
        
        async function carregar() {
            const div = document.getElementById('resultado');
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/testar_rede?p_id_participante=${USUARIO_ID}`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Dados:', data);
                
                if (!data || data.length === 0) {
                    div.innerHTML = '<p>Nenhum dado encontrado. Verifique se a função testar_rede existe.</p>';
                    return;
                }
                
                function render(node, level = 0) {
                    const indent = level * 25;
                    let html = `<div class="node active" style="margin-left: ${indent}px">`;
                    html += `<strong>${node.nome}</strong> (ID:${node.id}) `;
                    html += `<span class="plano-badge">${node.plano}</span> `;
                    html += `<span class="status-badge status-${node.status}">${node.status}</span>`;
                    if (node.posicao > 0) html += ` 📍 Pos: ${node.posicao}`;
                    html += `</div>`;
                    
                    const filhos = data.filter(p => p.id_pai === node.id && p.status === 'Ativo');
                    if (filhos.length > 0) {
                        html += `<div class="children">`;
                        filhos.forEach(filho => {
                            html += render(filho, level + 1);
                        });
                        html += `</div>`;
                    }
                    return html;
                }
                
                const root = data.find(p => p.nivel === 0);
                if (!root) {
                    div.innerHTML = '<p>Raiz não encontrada.</p>';
                    return;
                }
                
                div.innerHTML = render(root);
                
                // Estatísticas
                const totalAtivos = data.filter(p => p.status === 'Ativo').length;
                div.innerHTML += `<p style="margin-top: 20px;"><strong>Total de membros ativos: ${totalAtivos}</strong></p>`;
                
            } catch (error) {
                console.error('Erro:', error);
                div.innerHTML = `<div class="error">❌ Erro: ${error.message}</div>`;
            }
        }
        
        carregar();
    </script>
</body>
</html>
